<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cost Firewall — Approvals</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .badge {
      font-size: 0.75rem;
      background: var(--warning);
      color: #000;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: var(--primary);
    }
    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      font-size: 0.9rem;
    }
    .detail-item {
      background: rgba(255,255,255,0.03);
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
    }
    .detail-item span { display: block; color: var(--text-muted); font-size: 0.75rem; }
    .reason-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #fbbf24;
    }
    .actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-approve { background: var(--success); color: white; }
    .btn-deny { background: var(--danger); color: white; }
    .btn-refresh { background: var(--border); color: var(--text); font-size: 0.8rem; padding: 0.4rem 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ Cost Firewall <span style="font-weight: 300; font-size: 1.2rem;">Pending Approvals</span></h1>
      <button class="btn-refresh" onclick="loadApprovals()">↻ Refresh</button>
    </header>

    <div id="approvals-list">
      <div class="empty-state">Loading pending approvals...</div>
    </div>
  </div>

  <script>
    async function loadApprovals() {
      try {
        const res = await fetch('/api/approvals');
        const list = await res.json();
        const container = document.getElementById('approvals-list');

        if (!list || list.length === 0) {
          container.innerHTML = '<div class="empty-state">✨ No pending approval requests right now.</div>';
          return;
        }

        container.innerHTML = list.map(a => `
          <div class="card" id="card-${a.run_id}">
            <div class="card-header">
              <span>Run: ${a.run_id}</span>
              <span class="badge">PAUSED</span>
            </div>
            <div class="details">
              <div class="detail-item"><span>User / Feature</span>${a.user || 'unknown'} / ${a.feature || 'unknown'}</div>
              <div class="detail-item"><span>Current Spend</span>Rs ${parseFloat(a.spent || 0).toFixed(4)}</div>
              <div class="detail-item"><span>Call Estimate</span>Rs ${parseFloat(a.est || 0).toFixed(4)}</div>
              <div class="detail-item"><span>Projected (Cap)</span>Rs ${parseFloat(a.projected || 0).toFixed(4)} (Rs ${a.cap})</div>
            </div>
            <div class="reason-box">⚠️ ${a.reason || 'Paused by policy'}</div>
            <div class="actions">
              <button class="btn-deny" onclick="deny('${a.run_id}')">❌ Deny</button>
              <button class="btn-approve" onclick="approve('${a.run_id}', ${parseFloat(a.cap || 3) * 2})">✅ Approve (New Cap: Rs ${(parseFloat(a.cap || 3) * 2).toFixed(1)})</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('approvals-list').innerHTML = `<div class="empty-state" style="color:var(--danger)">Error loading approvals: ${err.message}</div>`;
      }
    }

    async function approve(runId, newCap) {
      const res = await fetch(`/api/approvals/${encodeURIComponent(runId)}/approve?new_cap=${newCap}`, { method: 'POST' });
      if (res.ok) {
        loadApprovals();
      } else {
        alert('Failed to approve request');
      }
    }

    async function deny(runId) {
      const res = await fetch(`/api/approvals/${encodeURIComponent(runId)}/deny`, { method: 'POST' });
      if (res.ok) {
        loadApprovals();
      } else {
        alert('Failed to deny request');
      }
    }

    // Auto-poll every 2 seconds
    loadApprovals();
    setInterval(loadApprovals, 2000);
  </script>
</body>
</html>
